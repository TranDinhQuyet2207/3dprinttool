/* ============================================================
   UTILS
   ============================================================ */
function loadLS(key, fallback){
  try { const v = localStorage.getItem(key); return v ? JSON.parse(v) : fallback; }
  catch(e){ return fallback; }
}
function saveLS(key, value){
  try { localStorage.setItem(key, JSON.stringify(value)); }
  catch(e){ console.warn('localStorage full?', e); }
}
function nextProductCode(products){
  const nums = products.map(p => parseInt(p.code, 10)).filter(n => !isNaN(n) && n >= 0);
  const max = nums.length ? Math.max(...nums) : 0;
  return String(max + 1).padStart(3, '0');
}
function escapeHtml(s){
  return String(s == null ? '' : s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

/* Suy ra tên màu tiếng Việt gần đúng từ mã hex */
const COLOR_NAME_MAP = (function(){
  const map = {};
  COLOR_PALETTE.forEach(c => { map[c.hex.toLowerCase()] = c.name; });
  return map;
})();

function inferColorName(hex){
  if (!hex) return '—';
  const key = String(hex).toLowerCase();
  if (COLOR_NAME_MAP[key]) return COLOR_NAME_MAP[key];
  const m = key.match(/^#?([0-9a-f]{6})$/i);
  if (!m) return hex;
  const r = parseInt(m[1].slice(0,2), 16);
  const g = parseInt(m[1].slice(2,4), 16);
  const b = parseInt(m[1].slice(4,6), 16);
  const max = Math.max(r,g,b), min = Math.min(r,g,b);
  const light = (max + min) / 2;
  const sat = max === min ? 0 : (light > 127 ? (max-min)/(2*255-max-min) : (max-min)/(max+min));
  if (sat < 0.12){
    if (light < 40) return 'Đen';
    if (light > 220) return 'Trắng';
    return 'Xám';
  }
  let h = 0;
  if (max === r) h = ((g-b)/(max-min)) % 6;
  else if (max === g) h = (b-r)/(max-min) + 2;
  else h = (r-g)/(max-min) + 4;
  h = Math.round(h * 60);
  if (h < 0) h += 360;
  if (h < 15 || h >= 345) return 'Đỏ';
  if (h < 40)  return 'Cam';
  if (h < 70)  return 'Vàng';
  if (h < 160) return 'Xanh lá';
  if (h < 200) return 'Xanh ngọc';
  if (h < 250) return 'Xanh dương';
  if (h < 290) return 'Tím';
  return 'Hồng';
}

const CHECKER_URL = (function(){
  try {

    const s = 14;
    c.width = s; c.height = s;
    const ctx = c.getContext('2d');
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0, 0, s, s);
    ctx.fillStyle = '#d1d5db';
    ctx.fillRect(0, 0, s/2, s/2);
    ctx.fillRect(s/2, s/2, s/2, s/2);
    return c.toDataURL();
  } catch(e){ return ''; }
})();

/* ============================================================
   COLOR SWATCH
   ============================================================ */
function ColorSwatch({ color, isTransparent, size='md' }){
  const sizes = { xs:'w-4 h-4', sm:'w-5 h-5', md:'w-8 h-8', lg:'w-10 h-10', xl:'w-12 h-12' };
  const cls = sizes[size] || sizes.md;
  if (isTransparent){
    return (
      <div className={`${cls} rounded shrink-0 checker-bg`}
        style={{ borderColor: color || '#888', borderWidth:2, borderStyle:'solid' }}
        title="Trong suốt" />
    );
  }
  return (
    <div className={`${cls} rounded border border-gray-300 dark:border-gray-600 shrink-0`}
      style={{ background: color || '#1a1a1a' }} title={color} />
  );
}

/* ============================================================
   SEARCHABLE MATERIAL SELECT (custom dropdown hiển thị swatch)
   ============================================================ */
function MaterialSelect({ value, materials, onChange }){
  const [open, setOpen] = useState(false);
  const [query, setQuery] = useState('');
  const wrapRef = useRef(null);
  const inputRef = useRef(null);

  const selected = materials.find(m => m.id === value) || null;

  useEffect(() => {
    if (!open) return;
    const onDocClick = (e) => {
      if (wrapRef.current && !wrapRef.current.contains(e.target)) setOpen(false);
    };
    document.addEventListener('mousedown', onDocClick);
    return () => document.removeEventListener('mousedown', onDocClick);
  }, [open]);

  useEffect(() => {
    if (open && inputRef.current) inputRef.current.focus();
  }, [open]);

  const filtered = materials.filter(m => {
    if (!query.trim()) return true;
    const q = query.toLowerCase();
    const colorName = m.kind === 'filament' ? inferColorName(m.color) : '';
    return (m.name + ' ' + (m.brand||'') + ' ' + (m.type||'') + ' ' + colorName).toLowerCase().includes(q);
  });

  const renderOptionRow = (m) => {
    if (m.kind === 'filament'){
      const cname = m.isTransparent ? 'Trong suốt' : inferColorName(m.color);
      return (
        <div className="flex items-center gap-2 w-full">
          {m.image
            ? <img src={m.image} alt="" className="w-5 h-5 rounded object-cover shrink-0 border border-gray-300 dark:border-gray-600" />
            : <ColorSwatch color={m.color} isTransparent={m.isTransparent} size="sm" />
          }
          <span className="font-medium truncate flex-1">{m.name}</span>
          <span className="text-gray-400 text-[11px] shrink-0">{cname}</span>
          <span className="text-gray-500 text-[11px] shrink-0 tabular-nums">
            {Number(m.pricePerKg).toLocaleString()}đ/kg
          </span>
        </div>
      );
    }
    /* kind === 'other' */
    return (
      <div className="flex items-center gap-2 w-full">
        {m.image
          ? <img src={m.image} alt="" className="w-5 h-5 rounded object-cover shrink-0 border border-gray-300 dark:border-gray-600" />
          : <div className="w-5 h-5 rounded bg-gray-200 dark:bg-gray-700 flex items-center justify-center text-[9px] font-bold text-gray-500 shrink-0">#</div>
        }
        <span className="font-medium truncate flex-1">{m.name}</span>
        <span className="text-gray-400 text-[11px] shrink-0">{m.unit || 'cái'}</span>
        <span className="text-gray-500 text-[11px] shrink-0 tabular-nums">
          {Number(m.unitPrice||0).toLocaleString()}đ
        </span>
      </div>
    );
  };

  return (
    <div ref={wrapRef} className="relative flex-1 min-w-0">
      <button
        type="button"
        onClick={() => setOpen(o => !o)}
        className="w-full bg-gray-50 dark:bg-gray-800 border border-gray-300 dark:border-gray-700 rounded-xl p-2 text-sm flex items-center gap-2 text-left hover:border-gray-400 dark:hover:border-gray-500"
      >
        {selected ? (
          <>
            {selected.kind === 'filament' ? (
              selected.image
                ? <img src={selected.image} alt="" className="w-5 h-5 rounded object-cover shrink-0 border border-gray-300 dark:border-gray-600" />
                : <ColorSwatch color={selected.color} isTransparent={selected.isTransparent} size="sm" />
            ) : (
              selected.image
                ? <img src={selected.image} alt="" className="w-5 h-5 rounded object-cover shrink-0 border border-gray-300 dark:border-gray-600" />
                : <div className="w-5 h-5 rounded bg-gray-200 dark:bg-gray-700 flex items-center justify-center text-[9px] font-bold text-gray-500 shrink-0">#</div>
            )}
            <span className="font-medium truncate flex-1">{selected.name}</span>
            <span className="text-gray-500 text-[11px] shrink-0">
              {selected.kind === 'filament'
                ? (selected.isTransparent ? 'Trong suốt' : inferColorName(selected.color))
                : (selected.unit || 'cái')}
            </span>
          </>
        ) : (
          <span className="text-gray-400">— Chọn vật liệu —</span>
        )}
        <i data-lucide="chevron-down" className="w-4 h-4 text-gray-400 shrink-0"></i>
      </button>

      {open && (
        <div className="absolute z-30 mt-1 left-0 right-0 bg-white dark:bg-gray-900 border border-gray-200 dark:border-gray-700 rounded-xl shadow-2xl max-h-72 overflow-hidden flex flex-col">
          <div className="p-2 border-b border-gray-100 dark:border-gray-800">
            <input
              ref={inputRef}
              type="text"
              value={query}
              onChange={(e) => setQuery(e.target.value)}
              placeholder="Tìm vật liệu..."
              className="w-full bg-gray-50 dark:bg-gray-800 border border-gray-200 dark:border-gray-700 rounded-lg px-2.5 py-1.5 text-xs focus:outline-none focus:border-blue-500"

          <div className="overflow-y-auto">
            {filtered.length === 0 ? (
              <div className="p-4 text-center text-xs text-gray-400">Không có vật liệu</div>
            ) : (
              filtered.map(m => (
                <button
                  key={m.id}
                  type="button"

                  className={`w-full text-left px-2.5 py-2 text-sm flex items-center hover:bg-gray-100 dark:hover:bg-gray-800 ${

                  {renderOptionRow(m)}
                </button>
              ))
            )}
          </div>
        </div>
      )}
    </div>
  );
}

/* ============================================================
   IMAGE CROPPER
   ============================================================ */
function ImageCropper({ src, onCrop, onCancel, outputSize = 500 }){
  const CONTAINER = 320;
  const BOX = 220;
  const [scale, setScale] = useState(1);
  const [pos, setPos] = useState({ x:0, y:0 });
  const [natural, setNatural] = useState({ w:0, h:0 });
  const imgRef = useRef(null);

  const onImgLoad = (e) => {
    const w = e.target.naturalWidth;
    const h = e.target.naturalHeight;
    setNatural({ w, h });
    const fit = Math.min(CONTAINER / w, CONTAINER / h);
    setScale(fit * 1.15);
    setPos({ x:0, y:0 });
  };

  const onPointerDown = (e) => {
    e.preventDefault();
    const startX = e.clientX, startY = e.clientY;
    const startPos = { ...pos };
    const onMove = (ev) => {
      setPos({ x: startPos.x + (ev.clientX - startX), y: startPos.y + (ev.clientY - startY) });
    };
    const onUp = () => {
      window.removeEventListener('pointermove', onMove);
      window.removeEventListener('pointerup', onUp);
    };
    window.addEventListener('pointermove', onMove);
    window.addEventListener('pointerup', onUp);
  };

  const doCrop = () => {
    if (!imgRef.current || !natural.w) return;
    const s = scale;
    const srcX = natural.w/2 - (BOX/2 + pos.x)/s;
    const srcY = natural.h/2 - (BOX/2 + pos.y)/s;
    const srcW = BOX / s;
    const srcH = BOX / s;

    const canvas = document.createElement('canvas');
    canvas.width = outputSize;
    canvas.height = outputSize;
    const ctx = canvas.getContext('2d');
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0, 0, outputSize, outputSize);
    try { ctx.drawImage(imgRef.current, srcX, srcY, srcW, srcH, 0, 0, outputSize, outputSize); }
    catch(err){ /* ignore */ }
    onCrop(canvas.toDataURL('image/jpeg', 0.88));
  };

  return (
    <div className="fixed inset-0 bg-black/80 backdrop-blur-sm z-[80] flex items-center justify-center p-4">
      <div className="bg-white dark:bg-gray-900 border border-gray-200 dark:border-gray-800 rounded-2xl p-4 w-full max-w-md shadow-2xl">
        <h3 className="font-bold text-base mb-3">Cắt ảnh</h3>
        <div className="relative bg-gray-900 rounded-xl overflow-hidden drag-none mx-auto"
          style={{ width: CONTAINER, height: CONTAINER, maxWidth:'100%' }}
          onPointerDown={onPointerDown}>
          <img ref={imgRef} src={src} onLoad={onImgLoad} draggable={false} alt="crop"
            style={{
              position:'absolute', left:'50%', top:'50%',
              transformOrigin:'center center',
              transform:`translate(-50%, -50%) translate(${pos.x}px, ${pos.y}px) scale(${scale})`,
              maxWidth:'none', pointerEvents:'none', userSelect:'none',
            }} />
          <div className="absolute inset-0 pointer-events-none">
            <div style={{
              position:'absolute', left:'50%', top:'50%',
              width:BOX, height:BOX,
              transform:'translate(-50%, -50%)',
              boxShadow:'0 0 0 9999px rgba(0,0,0,0.55)',
              border:'2px solid rgba(255,255,255,0.9)',
              borderRadius:4,
            }} />
          </div>
        </div>
        <div className="mt-3 flex items-center gap-3">
          <span className="text-xs text-gray-500 shrink-0">Thu phóng</span>
          <input type="range" min="0.1" max="3" step="0.01" value={scale}
            onChange={e => setScale(Number(e.target.value))} className="flex-1" />
          <span className="text-xs text-gray-500 tabular-nums w-10 text-right">{scale.toFixed(2)}x</span>
        </div>
        <p className="text-[11px] text-gray-400 mt-2">Kéo ảnh để di chuyển, thanh trượt để thu phóng.</p>
        <div className="flex gap-3 mt-4">
          <button onClick={onCancel} className="flex-1 py-2.5 border border-gray-300 dark:border-gray-700 rounded-xl text-xs font-medium hover:bg-gray-50 dark:hover:bg-gray-800">Hủy</button>
          <button onClick={doCrop} className="flex-1 bg-black text-white dark:bg-white dark:text-black py-2.5 rounded-xl text-xs font-bold">Cắt &amp; lưu</button>
        </div>
      </div>
    </div>
  );
}

/* ============================================================
   PRODUCT MODAL
   ============================================================ */
function ProductModal({ product, existingProducts, onSave, onDelete, onClose }){
  const isEdit = !!product;
  const [code, setCode] = useState(product ? product.code : nextProductCode(existingProducts));
  const [note, setNote] = useState(product ? (product.note || '') : '');
  const [link, setLink] = useState(product ? (product.link || '') : '');
  const [image, setImage] = useState(product ? (product.image || '') : '');
  const [rawImage, setRawImage] = useState(null);
  const [error, setError] = useState('');

  const handleFile = (e) => {
    const file = e.target.files?.[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onloadend = () => setRawImage(reader.result);
    reader.readAsDataURL(file);
    e.target.value = '';
  };

  const handleSubmit = (e) => {
    e.preventDefault();
    const clean = code.trim();
    if (!clean){ setError('Mã không được trống.'); return; }
    const dup = existingProducts.find(p =>
      p.code.toUpperCase() === clean.toUpperCase() && (!product || p.id !== product.id)
    );
    if (dup){ setError('⚠ Mã sản phẩm đã tồn tại.'); return; }
    onSave({
      id: product ? product.id : 'prod_' + Date.now(),
      code: clean, note, link: link.trim(), image,
    });
    onClose();
  };

  return (
    <>
      <div className="fixed inset-0 bg-black/60 backdrop-blur-sm z-[70] flex items-center justify-center p-4">
        <div className="bg-white dark:bg-gray-900 border border-gray-200 dark:border-gray-800 rounded-2xl w-full max-w-md p-6 shadow-2xl max-h-[90vh] overflow-y-auto">
          <h3 className="font-bold text-base mb-4">{isEdit ? 'Chỉnh sửa sản phẩm' : 'Thêm sản phẩm mới'}</h3>
          <form onSubmit={handleSubmit} className="space-y-4">
            <div>
              <label className="block text-xs font-medium text-gray-500 mb-1">Mã sản phẩm</label>
              <input type="text" value={code} readOnly={!isEdit}
                onChange={(e) => { setCode(e.target.value); setError(''); }}
                className={`w-full bg-gray-50 dark:bg-gray-800 border border-gray-300 dark:border-gray-700 rounded-xl p-2.5 text-sm font-mono font-bold ${!isEdit ? 'text-gray-400 cursor-not-allowed' : ''}`} />
              <p className="text-[11px] text-gray-400 mt-1">
                {isEdit ? 'Có thể đổi mã nếu cần.' : 'Mã tự động tăng dần (001, 002, 003…).'}
              </p>
              {error && <p className="text-red-500 text-xs mt-1">{error}</p>}
            </div>

            <div>

/* ============================================================
   CALCULATION LOGIC
   ------------------------------------------------------------
   input.lines: [{ material, qty }]  — qty là gram (filament) hoặc số cái (other)
   ============================================================ */
function calculatePricing(printer, lines, totalMinutes, profitPercent, settings){
  let plasticCost = 0;      // nhựa in
  let otherCost = 0;        // vật liệu khác
  let totalFilamentGrams = 0;
  let totalOtherQty = 0;

  lines.forEach(({ material, qty }) => {
    if (!material) return;
    if (material.kind === 'filament'){
      const waste = (material.wastePercent ?? 5) / 100;
      const realWeight = qty * (1 + waste);
      plasticCost += ((material.pricePerKg || 180000) * realWeight) / 1000;
      totalFilamentGrams += qty;
    } else {
      otherCost += (Number(material.unitPrice) || 0) * qty;
      totalOtherQty += qty;
    }
  });

  const hours = totalMinutes / 60;
  const powerKw = (printer?.powerW || 150) / 1000;
  const electricityCost = powerKw * hours * settings.electricityPrice;
  const machineCost = hours * settings.machineCostPerHour;
  const productionCost = plasticCost + otherCost + electricityCost + machineCost;
  const shippingCost = settings.includeShippingInCost ? Number(settings.shippingCost) || 0 : 0;
  const totalCost = productionCost + shippingCost;

  const commissionRate = Math.min((Number(settings.commissionRate) || 0) / 100, 0.95);
  const profitRate = (Number(profitPercent) || 0) / 100;

  let sellingRaw;
  if (1 - commissionRate > 0){
    sellingRaw = (totalCost * (1 + profitRate)) / (1 - commissionRate);
  } else {
    sellingRaw = totalCost * (1 + profitRate);
  }
  const step = Number(settings.roundingStep) || 1000;
  const sellingRounded = Math.ceil(sellingRaw / step) * step;

  const commission = sellingRounded * commissionRate;
  const received = sellingRounded - commission;
  const profit = received - totalCost;
  const actualProfitPercent = totalCost > 0 ? (profit / totalCost) * 100 : 0;

  const warnings = [];
  if ((printer?.powerW || 0) === 0 || Number(settings.machineCostPerHour) === 0){
    warnings.push('Một số chi phí đang bằng 0. Giá vốn có thể bị đánh giá thấp.');
  }
  if (actualProfitPercent >= Number(settings.profitWarningThreshold)){
    warnings.push(`Biên lợi nhuận cao (${actualProfitPercent.toFixed(1)}%). Hãy kiểm tra lại trước khi bán.`);
  }

  return {
    plasticCost, otherCost,
    totalFilamentGrams, totalOtherQty,
    electricityCost, machineCost, shippingCost,
    productionCost, totalCost,
    sellingPriceRaw: sellingRaw, sellingPriceRounded: sellingRounded,
    commission, moneyReceived: received, profit, actualProfitPercent,
    warnings,
  };
}

async function renderNodeToPdf(node, filename){
  const canvas = await window.html2canvas(node, {
    scale: 2, backgroundColor: '#ffffff', useCORS: true, logging: false,
  });

  const { jsPDF } = window.jspdf;
  const pdf = new jsPDF({ unit: 'mm', format: 'a4', orientation: 'portrait' });
  const pdfW = pdf.internal.pageSize.getWidth();
  const pdfH = pdf.internal.pageSize.getHeight();
  const imgData = canvas.toDataURL('image/jpeg', 0.92);
  const cW = canvas.width, cH = canvas.height;
  const margin = 8;
  const availW = pdfW - margin * 2;
  const ratio = availW / cW;
  const scaledH = cH * ratio;

  if (scaledH <= pdfH - margin * 2){
    const y = (pdfH - scaledH) / 2;
    pdf.addImage(imgData, 'JPEG', margin, y, availW, scaledH);
  } else {
    const sliceHeightPx = Math.floor((pdfH - margin * 2) / ratio);
    let offsetY = 0, pageIndex = 0;
    while (offsetY < cH){
      const sliceH = Math.min(sliceHeightPx, cH - offsetY);
      const sliceCanvas = document.createElement('canvas');
      sliceCanvas.width = cW;
      sliceCanvas.height = sliceH;
      const ctx = sliceCanvas.getContext('2d');
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0, 0, cW, sliceH);
      ctx.drawImage(canvas, 0, offsetY, cW, sliceH, 0, 0, cW, sliceH);
      const sliceData = sliceCanvas.toDataURL('image/jpeg', 0.92);
      const sliceHmm = sliceH * ratio;
      if (pageIndex > 0) pdf.addPage();
      pdf.addImage(sliceData, 'JPEG', margin, margin, availW, sliceHmm);
      offsetY += sliceH;
      pageIndex++;
    }
  }
  pdf.save(filename);
}

function App(){
  const [settings, setSettings] = useState(() => ({ ...DEFAULT_SETTINGS, ...(loadLS(LS_SETTINGS, {}) || {}) }));
  const [printers] = useState(() => loadLS(LS_PRINTERS, DEFAULT_PRINTERS));
  const [materials, setMaterials] = useState(() => {
    const stored = loadLS(LS_MATERIALS, null);
    const base = Array.isArray(stored) && stored.length ? stored : DEFAULT_MATERIALS;
    return base.map(m => ({ kind: m.kind || 'filament', color:'#1a1a1a', isTransparent:false, image:'', ...m }));
  });
  const [products, setProducts] = useState(() => loadLS(LS_PRODUCTS, []));
  const [calculations, setCalculations] = useState(() => loadLS(LS_HISTORY, []));

  const [activeTab, setActiveTab] = useState('calculator');
  const [toast, setToast] = useState(null);
  const [productModal, setProductModal] = useState(null);
  const [croppingMaterial, setCroppingMaterial] = useState(null);
  const [pdfLoading, setPdfLoading] = useState(null);
  const [newMaterialKind, setNewMaterialKind] = useState('filament');

  const [selectedProductCode, setSelectedProductCode] = useState('');
  const [selectedPrinterId, setSelectedPrinterId] = useState(printers[0]?.id || '');
  /* lines: [{ materialId, qty }] — qty = gram (filament) hoặc số cái (other) */
  const [lines, setLines] = useState([]);
  const [hours, setHours] = useState(3);
  const [minutes, setMinutes] = useState(20);
  const [profitPercent, setProfitPercent] = useState(settings.defaultProfitPercent);
  const [pricingMode, setPricingMode] = useState('percent');
  const [targetPrice, setTargetPrice] = useState('');

  /* Khởi tạo dòng mặc định khi danh sách vật liệu thay đổi và lines trống */
  useEffect(() => {
    if (lines.length === 0 && materials.length){
      setLines([{ materialId: materials[0].id, qty: 40 }]);
    }
  }, [materials, lines.length]);

  useEffect(() => saveLS(LS_SETTINGS, settings), [settings]);
  useEffect(() => saveLS(LS_MATERIALS, materials), [materials]);
  useEffect(() => saveLS(LS_PRODUCTS, products), [products]);
  useEffect(() => saveLS(LS_HISTORY, calculations), [calculations]);

  useEffect(() => {
    document.documentElement.classList.toggle('dark', settings.theme === 'dark');
  }, [settings.theme]);

  useEffect(() => { if (window.lucide) window.lucide.createIcons(); });

  const showToast = (msg) => { setToast(msg); setTimeout(() => setToast(null), 2200); };

  const sortedProducts = useMemo(() => {
    return [...products].sort((a, b) => a.code.localeCompare(b.code));
  }, [products]);

  useEffect(() => {
    if (!sortedProducts.length){ if (selectedProductCode) setSelectedProductCode(''); return; }
    const exists = sortedProducts.some(p => p.code === selectedProductCode);
    if (!exists) setSelectedProductCode(sortedProducts[0].code);
  }, [sortedProducts]);

  const selectedPrinter = printers.find(p => p.id === selectedPrinterId) || printers[0];

  const lineItems = useMemo(() => lines.map(it => ({
    material: materials.find(m => m.id === it.materialId) || null,
    qty: Number(it.qty) || 0,
  })), [lines, materials]);

  const totalMinutes = (Number(hours) || 0) * 60 + (Number(minutes) || 0);

  const costResult = useMemo(() => {
    if (!selectedPrinter || !lineItems.length) return null;
    return calculatePricing(selectedPrinter, lineItems, totalMinutes, 0, settings);
  }, [selectedPrinter, lineItems, totalMinutes, settings]);

  const priceModeResult = useMemo(() => {
    if (pricingMode !== 'price' || !costResult) return null;
    const price = Number(targetPrice);
    if (!price || price <= 0) return null;
    const commissionRate = Math.min((Number(settings.commissionRate) || 0) / 100, 0.95);
    const commission = price * commissionRate;
    const received = price - commission;
    const profit = received - costResult.totalCost;
    const profitPct = costResult.totalCost > 0 ? (profit / costResult.totalCost) * 100 : 0;
    return { price, commission, received, profit, profitPercent: profitPct };
  }, [pricingMode, targetPrice, costResult, settings.commissionRate]);

  const result = useMemo(() => {
    if (!costResult) return null;

    if (pricingMode === 'price' && priceModeResult){
      const warnings = [];
      if ((selectedPrinter?.powerW || 0) === 0 || Number(settings.machineCostPerHour) === 0){
        warnings.push('Một số chi phí đang bằng 0. Giá vốn có thể bị đánh giá thấp.');
      }
      if (priceModeResult.profitPercent >= Number(settings.profitWarningThreshold)){
        warnings.push(`Biên lợi nhuận cao (${priceModeResult.profitPercent.toFixed(1)}%). Hãy kiểm tra lại trước khi bán.`);
      }
      if (priceModeResult.profit < 0){

        moneyReceived: priceModeResult.received,
        profit: priceModeResult.profit,
        actualProfitPercent: priceModeResult.profitPercent,
        warnings,
        isPriceMode: true,

                  const isExporting = pdfLoading === p.id;
                  return (
                    <div key={p.id} className="relative bg-white dark:bg-gray-900 border border-gray-200 dark:border-gray-800 p-4 rounded-2xl flex gap-4">
                      <div className="absolute top-3 right-3 flex gap-1 z-10">
                        {last && (
                          <button onClick={() => handleExportOne(p)} disabled={isExporting}
                            className={`p-1.5 rounded-lg transition-colors ${
                              isExporting ? 'text-gray-300 dark:text-gray-600 cursor-wait'
                                          : 'text-gray-400 hover:text-emerald-600 hover:bg-gray-100 dark:hover:bg-gray-800'
                            }`}
                            title={isExporting ? 'Đang tạo PDF...' : 'Xuất báo giá PDF'}>
                            <i data-lucide={isExporting ? 'loader' : 'file-text'} className={`w-4 h-4 ${isExporting ? 'animate-spin' : ''}`}></i>
                          </button>
                        )}
                        <button onClick={() => setProductModal({ product: p })}
                          className="p-1.5 text-gray-400 hover:text-blue-600 hover:bg-gray-100 dark:hover:bg-gray-800 rounded-lg transition-colors"
                          title="Chỉnh sửa sản phẩm">
                          <i data-lucide="pencil" className="w-4 h-4"></i>
                        </button>
                      </div>

                      <div className="relative w-20 h-20 bg-gray-100 dark:bg-gray-800 rounded-xl flex items-center justify-center overflow-hidden shrink-0">
                        {p.image
                          ? <img src={p.image} alt={p.code} className="w-full h-full object-cover" />
                          : <span className="text-gray-400 text-[10px] font-mono">NO IMAGE</span>}
                        {p.link && (
                          <button onClick={() => window.open(p.link, '_blank', 'noopener,noreferrer')}
                            className="absolute inset-x-0 bottom-0 bg-blue-600/90 hover:bg-blue-600 text-white text-[9px] font-bold py-0.5 flex items-center justify-center gap-0.5"
                            title={p.link}>
                            <i data-lucide="external-link" className="w-2.5 h-2.5"></i> LINK
                          </button>
                        )}
                      </div>

                      <div className="flex-1 min-w-0 space-y-1 pr-16">
                        <h3 className="font-bold text-base font-mono">{p.code}</h3>
                        <p className="text-xs text-gray-500 line-clamp-1">{p.note || 'Không có ghi chú'}</p>
                        {last ? (
                          <div className="pt-2 flex justify-between text-xs border-t dark:border-gray-800 mt-2 gap-2">
                            <div>
                              <span className="text-gray-400 block text-[10px]">GIÁ VỐN</span>
                              <span className="font-medium">{Math.round(last.totalCost).toLocaleString()}đ</span>
                            </div>
                            <div className="text-right">
                              <span className="text-gray-400 block text-[10px]">GIÁ BÁN</span>
                              <span className="font-bold">{last.sellingPriceRounded.toLocaleString()}đ</span>
                            </div>
                            <div className="text-right">
                              <span className="text-gray-400 block text-[10px]">LỢI NHUẬN</span>
                              <span className="font-bold text-emerald-600 dark:text-emerald-400">
                                +{Math.round(last.profit).toLocaleString()}đ
                              </span>
                            </div>
                          </div>
                        ) : (
                          <p className="text-xs text-gray-400 pt-2">Chưa có dữ liệu tính giá</p>
                        )}
                      </div>
                    </div>
                  );
                })}
              </div>
            )}
          </div>
        )}

        {/* ============ SETTINGS ============ */}
        {activeTab === 'settings' && (
          <div className="max-w-3xl mx-auto space-y-6">
            <div className="bg-white dark:bg-gray-900 border border-gray-200 dark:border-gray-800 p-6 rounded-2xl space-y-4">
              <h2 className="font-bold text-lg">Thông tin thương hiệu (hiển thị trên PDF)</h2>
              <div className="grid grid-cols-1 sm:grid-cols-3 gap-4">
                <div>
                  <label className="block text-xs font-medium text-gray-500 mb-1">Tên cửa hàng / thương hiệu</label>
                  <input value={settings.brandName || ''}
                    onChange={(e) => setSettings(s => ({ ...s, brandName: e.target.value }))}
                    placeholder="3D Print Studio"
                    className="w-full bg-gray-50 dark:bg-gray-800 border border-gray-300 dark:border-gray-700 rounded-xl p-2.5 text-sm" />
                </div>
                <div>
                  <label className="block text-xs font-medium text-gray-500 mb-1">Số điện thoại</label>
                  <input value={settings.brandPhone || ''}
                    onChange={(e) => setSettings(s => ({ ...s, brandPhone: e.target.value }))}
                    className="w-full bg-gray-50 dark:bg-gray-800 border border-gray-300 dark:border-gray-700 rounded-xl p-2.5 text-sm" />
                </div>
                <div>
                  <label className="block text-xs font-medium text-gray-500 mb-1">Email</label>
                  <input value={settings.brandEmail || ''}
                    onChange={(e) => setSettings(s => ({ ...s, brandEmail: e.target.value }))}
                    className="w-full bg-gray-50 dark:bg-gray-800 border border-gray-300 dark:border-gray-700 rounded-xl p-2.5 text-sm" />
                </div>
              </div>
            </div>

            <div className="bg-white dark:bg-gray-900 border border-gray-200 dark:border-gray-800 p-6 rounded-2xl space-y-4">
              <h2 className="font-bold text-lg">Cấu hình chi phí mặc định</h2>
              <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div>
                  <label className="block text-xs font-medium text-gray-500 mb-1">Giá điện (VND / kWh)</label>
                  <input type="number" value={settings.electricityPrice}
                    onChange={(e) => setSettings(s => ({ ...s, electricityPrice: Number(e.target.value) }))}
                    className="w-full bg-gray-50 dark:bg-gray-800 border border-gray-300 dark:border-gray-700 rounded-xl p-2.5 text-sm" />
                </div>
                <div>
                  <label className="block text-xs font-medium text-gray-500 mb-1">Hao mòn máy (VND / giờ)</label>
                  <input type="number" value={settings.machineCostPerHour}
                    onChange={(e) => setSettings(s => ({ ...s, machineCostPerHour: Number(e.target.value) }))}
                    className="w-full bg-gray-50 dark:bg-gray-800 border border-gray-300 dark:border-gray-700 rounded-xl p-2.5 text-sm" />
                </div>
                <div>
                  <label className="block text-xs font-medium text-gray-500 mb-1">Shipping cố định (VND)</label>
                  <input type="number" value={settings.shippingCost}
                    onChange={(e) => setSettings(s => ({ ...s, shippingCost: Number(e.target.value) }))}
                    className="w-full bg-gray-50 dark:bg-gray-800 border border-gray-300 dark:border-gray-700 rounded-xl p-2.5 text-sm" />
                </div>
                <div>
                  <label className="block text-xs font-medium text-gray-500 mb-1">Hoa hồng sàn (%)</label>
                  <input type="number" value={settings.commissionRate}
                    onChange={(e) => setSettings(s => ({ ...s, commissionRate: Number(e.target.value) }))}
                    className="w-full bg-gray-50 dark:bg-gray-800 border border-gray-300 dark:border-gray-700 rounded-xl p-2.5 text-sm" />
                </div>
                <div>
                  <label className="block text-xs font-medium text-gray-500 mb-1">Quy tắc làm tròn</label>
                  <select value={settings.roundingStep}
                    onChange={(e) => setSettings(s => ({ ...s, roundingStep: Number(e.target.value) }))}
                    className="w-full bg-gray-50 dark:bg-gray-800 border border-gray-300 dark:border-gray-700 rounded-xl p-2.5 text-sm">
                    <option value={500}>500đ</option>
                    <option value={1000}>1.000đ</option>
                    <option value={5000}>5.000đ</option>
                    <option value={10000}>10.000đ</option>
                  </select>
                </div>
                <div>
                  <label className="block text-xs font-medium text-gray-500 mb-1">Lợi nhuận mặc định (%)</label>
                  <input type="number" value={settings.defaultProfitPercent}
                    onChange={(e) => setSettings(s => ({ ...s, defaultProfitPercent: Number(e.target.value) }))}
                    className="w-full bg-gray-50 dark:bg-gray-800 border border-gray-300 dark:border-gray-700 rounded-xl p-2.5 text-sm" />
                </div>
              </div>
              <label className="flex items-center gap-3 pt-2 cursor-pointer">
                <input type="checkbox" checked={settings.includeShippingInCost}
                  onChange={(e) => setSettings(s => ({ ...s, includeShippingInCost: e.target.checked }))}
                  className="w-4 h-4 rounded" />
                <span className="text-sm">Bao gồm shipping trong giá vốn</span>
              </label>
            </div>

            {/* === NHỰA IN 3D === */}
            <div className="bg-white dark:bg-gray-900 border border-gray-200 dark:border-gray-800 p-6 rounded-2xl space-y-4">
              <div className="flex justify-between items-center border-b dark:border-gray-800 pb-3">
                <div>
                  <h2 className="font-bold text-lg flex items-center gap-2">
                    <span className="w-2 h-2 rounded-full bg-blue-500"></span>
                    Nhựa in 3D ({filamentCount})
                  </h2>
                  <p className="text-[11px] text-gray-400 mt-0.5">Tính theo gram · Nhấn ô màu để thêm ảnh nhựa</p>
                </div>
                <button onClick={() => addMaterial('filament')}
                  className="bg-black text-white dark:bg-white dark:text-black px-3 py-1.5 rounded-lg text-xs font-medium">
                  + Thêm nhựa in
                </button>
              </div>

              <div className="space-y-3">
                {materials.filter(m => m.kind === 'filament').map(m => (
                  <div key={m.id} className="bg-gray-50 dark:bg-gray-800/50 border border-gray-200 dark:border-gray-700 rounded-xl p-3 space-y-2">
                    <div className="flex gap-2 items-center">
                      <div className="relative cursor-pointer shrink-0 group/thumb"
                        onClick={() => pickMaterialImage(m.id)}
                        title="Nhấn để thêm/đổi ảnh nhựa">
                        {m.image
                          ? <img src={m.image} alt="" className="w-12 h-12 rounded-lg object-cover border border-gray-300 dark:border-gray-600" />
                          : <ColorSwatch color={m.color} isTransparent={m.isTransparent} size="xl" />}
                        <div className="absolute -bottom-1 -right-1 bg-black text-white rounded-full p-1 opacity-90">
                          <i data-lucide="camera" className="w-3 h-3"></i>
                        </div>
                        {m.image && (
                          <button
                            onClick={(e) => { e.stopPropagation(); updateMaterial(m.id, { image: '' }); }}
                            className="absolute -top-1.5 -left-1.5 bg-red-500 text-white rounded-full p-0.5 opacity-0 group-hover/thumb:opacity-100 transition-opacity"
                            title="Xóa ảnh">
                            <i data-lucide="x" className="w-3 h-3"></i>
                          </button>
                        )}
                      </div>

                      <input value={m.name}
                        onChange={(e) => updateMaterial(m.id, { name: e.target.value })}
                        className="flex-1 bg-transparent border-b border-gray-300 dark:border-gray-600 font-bold text-sm pb-1 focus:outline-none focus:border-blue-500"
                        placeholder="Tên vật liệu" />
                      <button onClick={() => deleteMaterial(m.id)}
                        className="p-1.5 text-red-500 hover:bg-red-50 dark:hover:bg-red-950/40 rounded-lg shrink-0"
                        title="Xóa vật liệu">
                        <i data-lucide="trash-2" className="w-3.5 h-3.5"></i>
                      </button>
                    </div>

                    <div className="grid grid-cols-2 md:grid-cols-4 gap-2">
                      <div>
                        <label className="text-[10px] text-gray-500 uppercase">Hãng</label>
                        <input value={m.brand || ''}
                          onChange={(e) => updateMaterial(m.id, { brand: e.target.value })}
                          className="w-full bg-white dark:bg-gray-900 border border-gray-200 dark:border-gray-700 rounded-lg p-1.5 text-xs" />
                      </div>
                      <div>
                        <label className="text-[10px] text-gray-500 uppercase">Loại</label>
                        <input value={m.type || ''}
                          onChange={(e) => updateMaterial(m.id, { type: e.target.value })}
                          className="w-full bg-white dark:bg-gray-900 border border-gray-200 dark:border-gray-700 rounded-lg p-1.5 text-xs" />
                      </div>
                      <div>
                        <label className="text-[10px] text-gray-500 uppercase">Giá / kg (VND)</label>
                        <input type="number" value={m.pricePerKg}
                          onChange={(e) => updateMaterial(m.id, { pricePerKg: Number(e.target.value) })}
                          className="w-full bg-white dark:bg-gray-900 border border-gray-200 dark:border-gray-700 rounded-lg p-1.5 text-xs font-medium" />
                      </div>
                      <div>
                        <label className="text-[10px] text-gray-500 uppercase">Hao hụt %</label>
                        <input type="number" value={m.wastePercent}
                          onChange={(e) => updateMaterial(m.id, { wastePercent: Number(e.target.value) })}
                          className="w-full bg-white dark:bg-gray-900 border border-gray-200 dark:border-gray-700 rounded-lg p-1.5 text-xs" />
                      </div>
                    </div>

                    <div className="flex flex-wrap items-center justify-between gap-2 pt-1">
                      <div className="text-[11px] text-gray-500">
                        Màu: <b className="text-gray-700 dark:text-gray-300">
                          {m.isTransparent ? 'Trong suốt' : inferColorName(m.color)}
                        </b>
                      </div>
                      <div className="flex items-center gap-1.5 flex-wrap">
                        {COLOR_PALETTE.map(c => (
                          <button key={c.hex} onClick={() => updateMaterial(m.id, { color: c.hex })}
                            title={c.name}
                            className={`w-5 h-5 rounded-full border-2 transition-transform hover:scale-110 ${
                              m.color === c.hex ? 'border-blue-500 ring-2 ring-blue-200 dark:ring-blue-900' : 'border-gray-300 dark:border-gray-600'
                            }`}
                            style={{ background: c.hex }} />
                        ))}
                        <label className="w-5 h-5 rounded-full border-2 border-dashed border-gray-400 cursor-pointer relative overflow-hidden flex items-center justify-center text-[10px] text-gray-500 hover:scale-110 transition-transform"
                          title="Màu tùy chỉnh">
                          <span>+</span>
                          <input type="color" value={m.color || '#1a1a1a'}
                            onChange={(e) => updateMaterial(m.id, { color: e.target.value })}
                            className="absolute inset-0 opacity-0 cursor-pointer" />
                        </label>
                      </div>
                      <label className="flex items-center gap-2 cursor-pointer select-none">
                        <span className="text-[11px] font-medium text-gray-600 dark:text-gray-400">Trong suốt</span>
                        <div className={`relative w-9 h-5 rounded-full transition-colors ${m.isTransparent ? 'bg-emerald-500' : 'bg-gray-300 dark:bg-gray-600'}`}>
                          <input type="checkbox" checked={!!m.isTransparent}
                            onChange={(e) => updateMaterial(m.id, { isTransparent: e.target.checked })}
                            className="sr-only" />
                          <div className={`absolute top-0.5 w-4 h-4 bg-white rounded-full shadow transition-transform ${m.isTransparent ? 'translate-x-4' : 'translate-x-0.5'}`} />
                        </div>
                      </label>
                    </div>
                  </div>
                ))}
              </div>
            </div>

            {/* === VẬT LIỆU KHÁC === */}
            <div className="bg-white dark:bg-gray-900 border border-gray-200 dark:border-gray-800 p-6 rounded-2xl space-y-4">
              <div className="flex justify-between items-center border-b dark:border-gray-800 pb-3">
                <div>
                  <h2 className="font-bold text-lg flex items-center gap-2">
                    <span className="w-2 h-2 rounded-full bg-purple-500"></span>
                    Vật liệu khác ({otherCount})
                  </h2>
                  <p className="text-[11px] text-gray-400 mt-0.5">Ốc vít, đèn, mạch, phụ kiện… Tính theo đơn giá</p>
                </div>
                <button onClick={() => addMaterial('other')}
                  className="bg-black text-white dark:bg-white dark:text-black px-3 py-1.5 rounded-lg text-xs font-medium">
                  + Thêm vật liệu khác
                </button>
              </div>

              {otherCount === 0 ? (
                <div className="text-center text-xs text-gray-400 py-6 border border-dashed border-gray-300 dark:border-gray-700 rounded-xl">
                  Chưa có vật liệu khác. Nhấn "+ Thêm vật liệu khác" để bắt đầu (VD: Ốc vít, Đèn LED…)
                </div>
              ) : (
                <div className="space-y-3">
                  {materials.filter(m => m.kind === 'other').map(m => (
                    <div key={m.id} className="bg-gray-50 dark:bg-gray-800/50 border border-gray-200 dark:border-gray-700 rounded-xl p-3 space-y-2">
                      <div className="flex gap-2 items-center">
                        <div className="relative cursor-pointer shrink-0 group/thumb"
                          onClick={() => pickMaterialImage(m.id)}
                          title="Nhấn để thêm/đổi ảnh">
                          {m.image
                            ? <img src={m.image} alt="" className="w-12 h-12 rounded-lg object-cover border border-gray-300 dark:border-gray-600" />
                            : <div className="w-12 h-12 rounded-lg bg-purple-100 dark:bg-purple-950/40 flex items-center justify-center text-purple-600 dark:text-purple-300 text-lg font-bold">#</div>}
                          <div className="absolute -bottom-1 -right-1 bg-black text-white rounded-full p-1 opacity-90">
                            <i data-lucide="camera" className="w-3 h-3"></i>
                          </div>
                          {m.image && (
                            <button
                              onClick={(e) => { e.stopPropagation(); updateMaterial(m.id, { image: '' }); }}
                              className="absolute -top-1.5 -left-1.5 bg-red-500 text-white rounded-full p-0.5 opacity-0 group-hover/thumb:opacity-100 transition-opacity"
                              title="Xóa ảnh">
                              <i data-lucide="x" className="w-3 h-3"></i>
                            </button>
                          )}
                        </div>

                        <input value={m.name}
                          onChange={(e) => updateMaterial(m.id, { name: e.target.value })}
                          className="flex-1 bg-transparent border-b border-gray-300 dark:border-gray-600 font-bold text-sm pb-1 focus:outline-none focus:border-purple-500"
                          placeholder="Tên vật liệu (VD: Ốc vít M3x8)" />
                        <button onClick={() => deleteMaterial(m.id)}
                          className="p-1.5 text-red-500 hover:bg-red-50 dark:hover:bg-red-950/40 rounded-lg shrink-0"
                          title="Xóa vật liệu">
                          <i data-lucide="trash-2" className="w-3.5 h-3.5"></i>
                        </button>
                      </div>

                      <div className="grid grid-cols-2 gap-2">
                        <div>
                          <label className="text-[10px] text-gray-500 uppercase">Đơn giá (VND)</label>
                          <input type="number" value={m.unitPrice || 0}
                            onChange={(e) => updateMaterial(m.id, { unitPrice: Number(e.target.value) })}
                            className="w-full bg-white dark:bg-gray-900 border border-gray-200 dark:border-gray-700 rounded-lg p-1.5 text-xs font-medium" />
                        </div>
                        <div>
                          <label className="text-[10px] text-gray-500 uppercase">Đơn vị</label>
                          <input value={m.unit || 'cái'}
                            onChange={(e) => updateMaterial(m.id, { unit: e.target.value })}
                            placeholder="cái, bộ, m..."
                            className="w-full bg-white dark:bg-gray-900 border border-gray-200 dark:border-gray-700 rounded-lg p-1.5 text-xs" />
                        </div>
                      </div>
                    </div>
                  ))}
                </div>
              )}
            </div>

            <div className="bg-white dark:bg-gray-900 border border-gray-200 dark:border-gray-800 p-6 rounded-2xl space-y-3">
              <h2 className="font-bold text-lg">Dữ liệu</h2>
              <p className="text-xs text-gray-500">Toàn bộ dữ liệu lưu trong trình duyệt (localStorage). Hãy xuất file để sao lưu.</p>
              <div className="flex flex-wrap gap-2">
                <button onClick={() => {
                    const blob = new Blob([JSON.stringify({ settings, printers, materials, products, calculations }, null, 2)], { type: 'application/json' });
                    const a = document.createElement('a');
                    a.href = URL.createObjectURL(blob);
                    a.download = '3d-print-pricing-' + new Date().toISOString().slice(0, 10) + '.json';
                    a.click();
                    URL.revokeObjectURL(a.href);
                  }}
                  className="px-3 py-2 text-xs border border-gray-300 dark:border-gray-700 rounded-lg hover:bg-gray-50 dark:hover:bg-gray-800">
                  Xuất JSON
                </button>
                <button onClick={() => {
                    const input = document.createElement('input');
                    input.type = 'file';
                    input.accept = '.json,application/json';
                    input.onchange = (e) => {
                      const file = e.target.files[0];
                      if (!file) return;
                      const reader = new FileReader();
                      reader.onload = (ev) => {
                        try {
                          const data = JSON.parse(ev.target.result);
                          if (data.settings) setSettings({ ...DEFAULT_SETTINGS, ...data.settings });
                          if (data.materials) setMaterials(data.materials.map(m => ({ kind:'filament', color:'#1a1a1a', isTransparent:false, image:'', ...m })));
                          if (data.products) setProducts(data.products);
                          if (data.calculations) setCalculations(data.calculations);
                          showToast('Đã nhập dữ liệu');
                        } catch(err){ alert('File không hợp lệ'); }
                      };
                      reader.readAsText(file);
                    };
                    input.click();
                  }}
                  className="px-3 py-2 text-xs border border-gray-300 dark:border-gray-700 rounded-lg hover:bg-gray-50 dark:hover:bg-gray-800">
                  Nhập JSON
                </button>
                <button onClick={() => {
                    if (!window.confirm('Xóa TOÀN BỘ dữ liệu?')) return;
                    localStorage.removeItem(LS_SETTINGS);
                    localStorage.removeItem(LS_MATERIALS);
                    localStorage.removeItem(LS_PRODUCTS);
                    localStorage.removeItem(LS_HISTORY);
                    window.location.reload();
                  }}
                  className="px-3 py-2 text-xs border border-red-200 dark:border-red-900 text-red-600 dark:text-red-400 rounded-lg hover:bg-red-50 dark:hover:bg-red-950/40">
                  Xóa toàn bộ
                </button>
              </div>
            </div>
          </div>
        )}

      </main>

      {productModal && (
        <ProductModal
          product={productModal.product}
          existingProducts={products}
          onSave={handleSaveProduct}
          onDelete={handleDeleteProduct}
          onClose={() => setProductModal(null)}
        />
      )}

      {croppingMaterial && (
        <ImageCropper
          src={croppingMaterial.src}
          outputSize={400}
          onCrop={(cropped) => {
            updateMaterial(croppingMaterial.id, { image: cropped });
            setCroppingMaterial(null);
          }}
          onCancel={() => setCroppingMaterial(null)}
        />
      )}

      {toast && (
        <div className="fixed bottom-6 left-1/2 -translate-x-1/2 bg-gray-900 text-white dark:bg-white dark:text-black px-4 py-2.5 rounded-xl text-sm font-medium shadow-2xl z-[100]">
          {toast}
        </div>
      )}
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
</body>
</html>
